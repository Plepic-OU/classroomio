<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#333333" />

  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />

  <!--
    Plyr is the video-player library — only relevant on lesson pages.
    Defer/lazy: a sync <script> here blocked rendering 80–120 ms on every
    route per Lighthouse `render-blocking-resources`. The matching CSS
    is preloaded then promoted to a stylesheet so we keep the styles when
    Plyr actually mounts, without blocking initial paint.
    Removed: `<link rel="stylesheet" href="…/carbon-all.css">`
      Lighthouse `unused-css-rules` showed 71 KB / 97 % of it unused on
      every route — `carbon-components-svelte` ships per-component CSS
      already, so the global CDN sheet was dead weight + 430–445 ms of
      render-blocking.
  -->
  <link rel="preload" as="style" href="https://cdn.plyr.io/3.7.3/plyr.css"
        onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdn.plyr.io/3.7.3/plyr.css" /></noscript>

  <script nonce="%sveltekit.nonce%" defer src="https://umami.hz.oncws.com/script.js"
    data-website-id="80a9544a-4dda-4c91-b62f-b6be7a8a3b5c"></script>

  <script nonce="%sveltekit.nonce%" defer src="https://cdn.plyr.io/3.7.3/plyr.js"></script>

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
